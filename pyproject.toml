[project]
name = "agent-cli"
version = "0.1.0"
description = "A CLI agent built with LangChain"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "langchain>=0.1.0",
    "langchain-community>=0.0.10",
    "click>=8.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
agent = "agent_cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
